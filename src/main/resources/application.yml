spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-public
              uri: http://127.0.0.1:8080
              predicates:
                - Path=/api/v1/auth/login, /api/v1/auth/register
            - id: doctor-service
              uri: http://127.0.0.1:8081
              predicates:
                - Path=/api/v1/doctors/**
              filters:
                - jwtFilter
            - id: patient-service
              uri: http://127.0.0.1:8082
              predicates:
                - Path=/api/v1/patients/**
              filters:
                - jwtFilter

server:
  port: 80

app:
  jwt:
    secret: VGhpcy1Jcy1BLVZlcnktU2VjdXJlLVNlY3JldC1LZXktRm9yLUpXVC1BcGktQXV0aGVudGljYXRpb24=

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.web.servlet.function: TRACE
    org.springframework.cloud.gateway.server.mvc: TRACE
    org.springframework.cloud.gateway.server.webmvc: TRACE
